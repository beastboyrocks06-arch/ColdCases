name: Youtube ColdCases Video


on:
  schedule:
    # Intended: 8:00 AM New York | Runs early at 8:30 AM UTC to beat the 3.5h delay
    - cron: '30 8 * * *'
    # Intended: 7:00 PM New York | Runs early at 7:30 PM UTC to beat the 3.5h delay
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Match your project requirements
          pip install moviepy==2.2.1 
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      pillow numpy faster-whisper

      - name: Run Script
        env:
          # Add your Google/Cloudinary secrets here in GitHub Repository Settings
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python coldcases_uploader.py

      - name: Commit updated status
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # 1. Stash changes to coldcases.csv so the folder is clean
          git stash

          # 2. Pull latest changes safely
          git pull origin main --rebase

          # 3. Bring back our CSV changes
          git stash pop || echo "No changes to pop"

          # 4. Add ONLY the CSV file (ignore any stray temp video files)
          git add coldcases.csv
          
          # 5. Commit and push only if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto update: ColdCases posted status"
            git push origin main
          else
            echo "No changes to commit, skipping push."
          fi
