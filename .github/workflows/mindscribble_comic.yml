name: Youtube MindScribble Comic
on:
  schedule:
    # Runs daily at 17:00 UTC (1:00 PM EST / 10:00 AM PST)
    # Target peak engagement hours: 2:00 PM - 4:00 PM EST
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Fetch LFS video binary files
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-dejavu

          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      google-auth-httplib2 pillow numpy faster-whisper opencv-python

      - name: Run Script
        env:
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python mindscribble_comic_uploader.py

      - name: Commit updated JSON status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git stash

          git pull origin main --rebase

          git stash pop || echo "No changes to pop"

          git add mindscribble_comic/mindscribble.json

          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-update posted status in mindscribble.json [skip ci]"

          git push origin main
