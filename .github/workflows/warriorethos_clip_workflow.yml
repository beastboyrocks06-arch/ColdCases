name: Youtube Warrior Ethos Clip
on:
  schedule:
    # Runs daily at 16:40 UTC (20 minutes before 17:00 UTC)
    - cron: '40 16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Fetch LFS video binary files
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-dejavu

          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      google-auth-httplib2 pillow numpy faster-whisper opencv-python

      - name: Run Script
        env:
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLIENT_SECRET_FILE: ${{ secrets.CLIENT_SECRET_FILE }}
        run: python warrior_ethos_clip_uploader.py

      - name: Commit updated JSON status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Temporarily save the updated JSON file created during this run
          cp warrior_ethos/warriorethos.json /tmp/warriorethos.json

          # Discard all generated video files and working tree modifications
          git reset --hard HEAD
          git clean -fd

          # Fetch and rebase cleanly against the remote main branch
          git fetch origin main
          git rebase origin/main

          # Restore the updated JSON file
          cp /tmp/warriorethos.json warrior_ethos/warriorethos.json

          # Stage and commit only the JSON status file
          git add warrior_ethos/warriorethos.json

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update posted status in warrior_ethos.json [skip ci]"
            git push origin main
          else
            echo "No status changes to commit."
          fi