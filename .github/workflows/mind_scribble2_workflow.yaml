name: Youtube New MindScribble Video

on:
  schedule:
    # Intended: 7:00 PM New York | Runs early at 7:30 PM UTC to beat the 3.5h delay
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: true # CRITICAL: Ensures image and audio media files are fully pulled

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      cloudinary pillow numpy faster-whisper

      - name: Run Script
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python mindscribble_uploader.py

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Save changes
          git stash

          # Pull latest
          git pull origin main --rebase

          # Re-apply changes
          git stash pop || echo "No changes to pop"

          # Commit if changes exist
          git add mind_scribble2.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update posted status"

          git push origin main
